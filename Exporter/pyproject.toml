[project]
name = "kev-coreml-exporter"
version = "0.1.0"
description = "Offline-Export von Kev nach Core ML plus Golden-Referenzen fuer den Paritaetstest"
requires-python = ">=3.12,<3.13"
dependencies = [
    "coremltools>=9.0",
    "huggingface-hub>=0.26",
    "numpy>=2.0",
    "peft>=0.15",
    "pydantic>=2.9",
    "scikit-learn>=1.5",
    "torch>=2.7,<2.9",
    "transformers>=4.51,<4.58",
    "accelerate>=1.0",
    "datasets>=3.0",
]

[tool.uv.sources]
kev = { path = "../vendor/kev" }
